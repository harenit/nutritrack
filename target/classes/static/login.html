<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NutriTrack – Login</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">Nutri<span>Track</span></div>
    <p class="auth-sub">Your AI-powered meal companion 🥗</p>

    <div id="msg"></div>

    <div class="form-group">
      <label class="form-label">Username</label>
      <input class="form-input" id="username" type="text" placeholder="your_username" autocomplete="username"/>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" id="password" type="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>

    <button class="btn btn-primary" style="width:100%;margin-top:0.5rem" onclick="doLogin()">
      Login →
    </button>

    <div class="auth-footer">
      Don't have an account? <a href="/register">Register here</a>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="/js/utils.js"></script>
<script>
  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('msg');
    if (!username || !password) {
      msg.innerHTML = '<div class="alert alert-error">Please fill in all fields.</div>';
      return;
    }
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const text = await res.text();
    if (text === 'ok') {
      window.location.href = '/dashboard';
    } else {
      msg.innerHTML = `<div class="alert alert-error">${text}</div>`;
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
